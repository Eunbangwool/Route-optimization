# ===================================================================
# Route Optimizer Web — Compose Multiplatform Web (WASM) 자동 빌드
#
# :web 모듈 빌드. 빌드 실패 시 claude/** 브랜치에 에러 로그를 커밋해
# (Actions 로그 직접 열람이 불가한 원격 환경에서) 진단 가능하게 한다.
# ===================================================================

name: Build Web

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'web/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-web.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정 (자동 캐시)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Web (WASM) 프로덕션 빌드
        run: |
          set -o pipefail
          ./gradlew :web:wasmJsBrowserDistribution --stacktrace 2>&1 | tee web-build.log

      - name: 빌드 산출물 확인
        run: |
          DIST_DIR=web/build/dist/wasmJs/productionExecutable
          if [ -d "$DIST_DIR" ]; then
            echo "✅ 빌드 산출물: $DIST_DIR"
            ls -la "$DIST_DIR"
          else
            echo "❌ 산출물 디렉터리 없음"
            find web/build -type d | head -20
            exit 1
          fi

      - name: 정적 자원 artifact 업로드
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: routeopt-web-dist
          path: web/build/dist/wasmJs/productionExecutable
          retention-days: 7

      # GitHub Pages 배포: 산출물을 gh-pages 브랜치로 강제 푸시.
      # Settings → Pages → Source = "Deploy from a branch" → gh-pages / (root) 로 한 번 설정하면
      # https://eunbangwool.github.io/Route-optimization/ 에서 서빙된다.
      - name: 🚀 GitHub Pages 배포 (gh-pages 브랜치)
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DIST=web/build/dist/wasmJs/productionExecutable
          touch "$DIST/.nojekyll"           # _ 로 시작하는 자원 서빙 (Jekyll 우회)
          # 캐시 무효화: 앱 번들 파일명이 매 배포 동일 → index.html 의 참조에 커밋 해시 쿼리 부여
          SHA=${GITHUB_SHA::7}
          sed -i "s#routeopt-web\.js#routeopt-web.js?v=${SHA}#g" "$DIST/index.html"
          cd "$DIST"
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "✅ gh-pages 배포 완료 → https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: 🐛 빌드 실패 시 에러 로그를 브랜치에 커밋 (claude/** push 만)
        if: failure() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "# Web build error — run #${{ github.run_number }} — ${GITHUB_SHA}"
            echo
            echo "## 매치된 에러 라인"
            grep -nE '^(e: |error: |FAILED|BUILD FAILED|Compilation failed|> Task |\* What went wrong:|> Could not|Unresolved reference|Type mismatch|None of the following|This member|Could not resolve|Caused by)' web-build.log | head -200
            echo
            echo "## 로그 마지막 250줄"
            tail -n 250 web-build.log
          } > ci-logs/web-build-error.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/web-build-error.log
          git commit -m "ci(web): capture build error log (run #${{ github.run_number }})" || { echo "변경 없음"; exit 0; }
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "에러 로그 푸시 완료"; exit 0; }
            sleep $((attempt * 2))
          done
          echo "에러 로그 푸시 실패"

      - name: 빌드 로그 artifact 업로드
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          retention-days: 5
          if-no-files-found: warn
